<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analyseur de combat WvW — logs ArcDPS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');

:root{
  --bg:#12151a;
  --bg-alt:#181c23;
  --panel:#1c2029;
  --panel-2:#232834;
  --line:#2c323f;
  --gold:#c9a15a;
  --gold-soft:#e3c98a;
  --text:#e9e6dd;
  --text-dim:#9aa0ad;
  --red:#c1443c;
  --red-soft:#ef6a62;
  --green:#5fae7d;
  --blue:#5a9bc9;
  --purple:#9d7bc9;
  --amber:#d8952f;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(ellipse at top, #1a1f28 0%, var(--bg) 55%),
    var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  min-height:100vh;
  padding-bottom:80px;
}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px;}

/* ---------- header ---------- */
header.top{
  padding:34px 20px 22px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg, rgba(201,161,90,.06), transparent);
}
header.top .wrap{display:flex;align-items:baseline;justify-content:space-between;gap:20px;flex-wrap:wrap}
h1{
  font-family:'Cinzel',serif;
  font-weight:700;
  font-size:1.7rem;
  letter-spacing:.03em;
  margin:0;
  color:var(--gold-soft);
  text-shadow:0 0 24px rgba(201,161,90,.25);
}
h1 small{display:block;font-family:'Inter';font-weight:500;font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--text-dim);margin-top:4px}
.tagline{color:var(--text-dim);font-size:.85rem;max-width:420px;line-height:1.5}

/* ---------- dropzone ---------- */
.dz{
  margin:34px 0;
  border:1.5px dashed #3a4150;
  border-radius:14px;
  background:var(--panel);
  padding:52px 24px;
  text-align:center;
  transition:.15s border-color, .15s background;
  cursor:pointer;
}
.dz.drag{border-color:var(--gold);background:#20242f}
.dz .icon{font-size:2.4rem;margin-bottom:14px;filter:grayscale(.2)}
.dz h2{font-size:1.05rem;margin:0 0 8px;font-weight:600;color:var(--text)}
.dz p{color:var(--text-dim);font-size:.85rem;margin:4px 0}
.dz .fmt{display:inline-flex;gap:6px;margin-top:14px}
.dz .fmt span{
  font-family:'JetBrains Mono',monospace;font-size:.7rem;
  background:var(--panel-2);border:1px solid var(--line);color:var(--gold-soft);
  padding:3px 9px;border-radius:20px;
}
.dz input{display:none}
.btn{
  display:inline-block;margin-top:18px;padding:9px 20px;border-radius:8px;
  background:var(--gold);color:#1a1409;font-weight:600;font-size:.85rem;
  border:none;cursor:pointer;
}
.btn:hover{background:var(--gold-soft)}
.mini-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 16px;margin:22px 0;}
.mini-bar .fname{font-family:'JetBrains Mono',monospace;font-size:.8rem;color:var(--gold-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-bar button{background:none;border:1px solid var(--line);color:var(--text-dim);padding:6px 12px;border-radius:6px;font-size:.78rem;cursor:pointer}
.mini-bar button:hover{border-color:var(--gold);color:var(--gold-soft)}

/* ---------- loading ---------- */
.loading{padding:60px 20px;text-align:center;color:var(--text-dim)}
.progress{height:6px;background:var(--panel-2);border-radius:6px;overflow:hidden;max-width:360px;margin:16px auto 0}
.progress > div{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-soft));width:0%;transition:.15s width}

/* ---------- error ---------- */
.err{background:#2a1414;border:1px solid #5c2b28;color:#f3b6b1;border-radius:10px;padding:18px 20px;margin:24px 0}
.err b{color:var(--red-soft)}

/* ---------- sections/cards ---------- */
section{margin:34px 0}
.section-title{
  font-family:'Cinzel',serif;font-weight:600;font-size:1rem;letter-spacing:.03em;
  color:var(--gold-soft);margin:0 0 14px;display:flex;align-items:center;gap:10px;
}
.section-title:after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.grid{display:grid;gap:14px}
.grid.cols-4{grid-template-columns:repeat(4,1fr)}
.grid.cols-3{grid-template-columns:repeat(3,1fr)}
.grid.cols-2{grid-template-columns:repeat(2,1fr)}
@media(max-width:820px){.grid.cols-4{grid-template-columns:repeat(2,1fr)}.grid.cols-3{grid-template-columns:repeat(2,1fr)}.grid.cols-2{grid-template-columns:1fr}}
@media(max-width:520px){.grid.cols-4{grid-template-columns:1fr}}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.stat .label{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);margin-bottom:6px}
.stat .value{font-family:'JetBrains Mono',monospace;font-size:1.5rem;font-weight:600;color:var(--text)}
.stat .value.red{color:var(--red-soft)}
.stat .value.green{color:var(--green)}
.stat .value.gold{color:var(--gold-soft)}
.stat .sub{font-size:.72rem;color:var(--text-dim);margin-top:4px}

.pov-card{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.pov-avatar{
  width:52px;height:52px;border-radius:50%;
  background:linear-gradient(135deg,#2c3140,#1a1e26);
  border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;
  font-family:'Cinzel',serif;font-weight:700;color:var(--gold-soft);font-size:1.2rem;
}
.pov-name{font-weight:700;font-size:1.05rem}
.pov-sub{color:var(--text-dim);font-size:.82rem}

table{width:100%;border-collapse:collapse;font-size:.85rem}
th{text-align:left;color:var(--text-dim);font-weight:600;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;
  padding:6px 10px;border-bottom:1px solid var(--line)}
td{padding:8px 10px;border-bottom:1px solid #21262f}
tr:last-child td{border-bottom:none}
td.num, th.num{text-align:right;font-family:'JetBrains Mono',monospace}
.rowbar{position:relative}
.rowbar .fill{position:absolute;left:0;top:0;bottom:0;background:rgba(201,161,90,.12);z-index:0}
.rowbar .content{position:relative;z-index:1}
tr.pov-row td{background:rgba(201,161,90,.08)}
.tag{display:inline-block;font-size:.68rem;padding:1px 8px;border-radius:20px;background:var(--panel-2);color:var(--text-dim);border:1px solid var(--line);margin-left:6px}

/* boon bars */
.boonlist{display:flex;flex-direction:column;gap:9px}
.boon-row{display:grid;grid-template-columns:110px 1fr 52px;align-items:center;gap:10px;font-size:.8rem}
.boon-row .name{color:var(--text-dim)}
.boon-track{height:9px;background:var(--panel-2);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.boon-track > div{height:100%;border-radius:6px}
.boon-row .pct{font-family:'JetBrains Mono',monospace;text-align:right;color:var(--text)}
.skill-list{display:flex;flex-direction:column;gap:7px}
.skill-row{display:grid;grid-template-columns:32px 1fr auto;align-items:center;gap:9px;padding:6px 8px;border-bottom:1px solid #21262f;font-size:.82rem}
.skill-row:last-child{border-bottom:none}
.skill-icon{width:30px;height:30px;border-radius:5px;background:var(--panel-2);border:1px solid var(--line);object-fit:cover;display:flex;align-items:center;justify-content:center;color:var(--gold-soft);font-size:.95rem}
.skill-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.skill-count{font-family:'JetBrains Mono',monospace;color:var(--text-dim);white-space:nowrap}

/* diagnostics */
.diag{display:flex;flex-direction:column;gap:10px}
.diag-item{display:flex;gap:12px;padding:13px 16px;border-radius:9px;border:1px solid var(--line);background:var(--panel)}
.diag-item .dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex-shrink:0}
.diag-item.warn .dot{background:var(--red-soft)}
.diag-item.info .dot{background:var(--blue)}
.diag-item.good .dot{background:var(--green)}
.diag-item p{margin:0;font-size:.87rem;line-height:1.55;color:#dcd9d0}
.diag-item b{color:var(--gold-soft)}

/* down/death timeline items */
.event-item{border:1px solid var(--line);border-radius:9px;padding:14px 16px;background:var(--panel);margin-bottom:10px}
.event-item .evhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.event-item .evhead .t{font-family:'JetBrains Mono',monospace;color:var(--gold-soft);font-size:.85rem}
.event-item .evhead .badge{font-size:.7rem;padding:2px 10px;border-radius:20px}
.event-item.down .evhead .badge{background:rgba(216,149,47,.15);color:var(--amber);border:1px solid rgba(216,149,47,.4)}
.event-item.death .evhead .badge{background:rgba(193,68,60,.15);color:var(--red-soft);border:1px solid rgba(193,68,60,.4)}
.event-item .srcs{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--text-dim)}
.event-item .srcs b{color:var(--text)}

/* chart */
.chart-wrap{overflow-x:auto}
svg{display:block}
.legend{display:flex;gap:18px;font-size:.75rem;color:var(--text-dim);margin-top:10px}
.legend .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

footer{text-align:center;color:#5c6270;font-size:.72rem;padding:40px 20px 0}
.note{color:var(--text-dim);font-size:.78rem;line-height:1.6;margin-top:10px}

/* character selector */
.filter-input{
  width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
  color:var(--text);padding:9px 12px;font-size:.85rem;margin:2px 0 12px;font-family:'Inter';
}
.filter-input:focus{outline:none;border-color:var(--gold)}
.char-list{max-height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:5px;padding-right:4px}
.char-list::-webkit-scrollbar{width:7px}
.char-list::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
.char-row{
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;
  padding:8px 10px;border-radius:7px;border:1px solid transparent;cursor:pointer;
  transition:.1s background;
}
.char-row:hover{background:var(--panel-2)}
.char-row.active{background:rgba(201,161,90,.13);border-color:rgba(201,161,90,.4)}
.char-row .side{font-size:.63rem;padding:2px 7px;border-radius:20px;font-weight:600;letter-spacing:.03em;white-space:nowrap}
.char-row .side.ally{background:rgba(90,155,201,.15);color:var(--blue);border:1px solid rgba(90,155,201,.35)}
.char-row .side.enemy{background:rgba(193,68,60,.15);color:var(--red-soft);border:1px solid rgba(193,68,60,.35)}
.char-row .cinfo{overflow:hidden}
.char-row .cname{font-size:.85rem;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.char-row .cname .you{color:var(--gold-soft);font-weight:700}
.char-row .csub{font-size:.72rem;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.char-row .cdmg{font-family:'JetBrains Mono',monospace;font-size:.78rem;color:var(--text-dim);white-space:nowrap}
.char-empty{color:var(--text-dim);font-size:.82rem;padding:14px;text-align:center}
.subject-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.subject-tabs .stab{font-size:.75rem;padding:5px 13px;border-radius:20px;border:1px solid var(--line);background:var(--panel);color:var(--text-dim);cursor:pointer}
.subject-tabs .stab.active{border-color:var(--gold);color:var(--gold-soft);background:rgba(201,161,90,.1)}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div>
      <h1>Analyseur de combat WvW<small>logs ArcDPS · .evtc / .zevtc</small></h1>
    </div>
    <p class="tagline">Glissez-déposez un log de combat McM. Tout est analysé localement dans votre navigateur — aucun fichier n'est envoyé où que ce soit.</p>
  </div>
</header>

<div class="wrap">
  <div id="app"></div>
  <footer>Analyse locale et non-officielle du format ArcDPS EVTC</footer>
</div>

<script>
/* ======================================================================
   MOTEUR DE PARSING EVTC
   ====================================================================== */
/* ===================== Constantes EVTC ===================== */
const STATECHANGE = {
  COMBAT: 0, ENTERCOMBAT: 1, EXITCOMBAT: 2, CHANGEUP: 3, CHANGEDEAD: 4,
  CHANGEDOWN: 5, SPAWN: 6, DESPAWN: 7, HEALTHPCTUPDATE: 8, SQCOMBATSTART: 9,
  SQCOMBATEND: 10, WEAPSWAP: 11, MAXHEALTHUPDATE: 12, POINTOFVIEW: 13,
  LANGUAGE: 14, GWBUILD: 15, SHARDID: 16, REWARD: 17, BUFFINITIAL: 18,
  POSITION: 19, VELOCITY: 20, FACING: 21, TEAMCHANGE: 22, ATTACKTARGET: 23,
  TARGETABLE: 24, MAPID: 25, BUFFACTIVE: 27, BUFFDEACTIVE: 28, GUILD: 29,
  BUFFINFO: 30, BUFFFORMULA: 31, SKILLINFO: 32, RULESET: 52,
  BUFFAPPLY: 69, BUFFCHANGE: 70, BUFFREMOVE_SINGLE: 71, BUFFREMOVE_ALL: 72,
  WVWOBJECTIVESTATUS: 75, STEALTHCHANGE: 76
};

const IFF = { FRIEND: 0, FOE: 1, UNKNOWN: 2 };

const RESULT = {
  STRIKE_NORMAL: 0, STRIKE_CRIT: 1, STRIKE_GLANCE: 2, BLOCK: 3, EVADE: 4,
  INTERRUPT: 5, ABSORB: 6, BLIND: 7, KILLINGBLOW: 8, DOWNED: 9,
  DEFIANCE_DAMAGE: 10, SKILLCAST: 11, CROWDCONTROL: 12
};

// Professions coeur (id du champ "prof" quand is_elite != 0xFFFFFFFF)
const PROFESSIONS = {
  1: 'Gardien', 2: 'Guerrier', 3: 'Ingénieur', 4: 'Rôdeur', 5: 'Voleur',
  6: 'Élémentaliste', 7: 'Envoûteur', 8: 'Nécromant', 9: 'Revenant'
};

// Spécialisations d'élite (id du champ "is_elite")
const ELITE_SPECS = {
  5: 'Druide', 7: 'Daredevil', 18: 'Berserker', 27: 'Traqueur de dragon',
  34: 'Faucheur', 40: 'Chronomancien', 43: 'Ferrailleur', 48: 'Tempête',
  52: 'Héraut', 55: 'Bête-âme', 56: 'Tisse-lame', 57: 'Holosmith',
  58: 'Oeil-de-la-mort', 59: 'Mirage', 60: 'Fléau', 61: 'Bris-sort',
  62: 'Brandebrasier', 63: 'Renégat', 64: 'Vecteur', 65: 'Volontaire',
  66: 'Virtuose', 67: 'Catalyseur', 68: 'Lame-dragon', 69: 'Vindicateur',
  70: 'Mécano', 71: 'Spectre', 72: 'Sauvageon', 73: 'Troubadour',
  74: 'Paragon', 75: 'Amalgame', 76: 'Ritualiste', 77: 'Antiquaire',
  78: 'Galeshot', 79: 'Conduit', 80: 'Évocateur', 81: 'Luminaire'
};

// Buffs (boons) qu'on suit pour l'uptime, avec libellé FR + catégorie
const TRACKED_BUFFS = {
  740:  { name: 'Puissance',   cat: 'boon' },
  1187: { name: 'Célérité',    cat: 'boon' },
  725:  { name: 'Fureur',      cat: 'boon' },
  30328:{ name: 'Alacrité',    cat: 'boon' },
  717:  { name: 'Protection',  cat: 'boon' },
  718:  { name: 'Régénération',cat: 'boon' },
  719:  { name: 'Vivacité',    cat: 'boon' },
  726:  { name: 'Vigueur',     cat: 'boon' },
  1122: { name: 'Stabilité',   cat: 'boon' },
  743:  { name: 'Égide',       cat: 'boon' },
  26980:{ name: 'Résistance',  cat: 'boon' },
  13017:{ name: 'Camouflage',  cat: 'boon' },
  5974: { name: 'Vitesse sup.',cat: 'boon' },
  736:  { name: 'Saignement',  cat: 'condi' },
  737:  { name: 'Brûlure',     cat: 'condi' },
  861:  { name: 'Confusion',   cat: 'condi' },
  723:  { name: 'Poison',      cat: 'condi' },
  19426:{ name: 'Tourment',    cat: 'condi' },
  738:  { name: 'Vulnérabilité',cat: 'condi' },
  742:  { name: 'Faiblesse',   cat: 'condi' },
  720:  { name: 'Aveuglement', cat: 'condi' },
  722:  { name: 'Refroidi',    cat: 'condi' },
  721:  { name: 'Estropié',    cat: 'condi' },
  791:  { name: 'Peur',        cat: 'condi' },
  727:  { name: 'Immobilisé',  cat: 'condi' }
};
const BOON_ORDER = [740,1187,725,30328,717,1122,743,718,719,726,26980,13017];

const HEADER_SIZE = 16;
const AGENT_SIZE = 96;
const SKILL_SIZE = 68;
const EVENT_SIZE = 64;

/* ===================== Lecture ZIP (.zevtc) ===================== */
async function maybeUnzip(bytes) {
  // Signature locale ZIP : 50 4B 03 04
  if (!(bytes[0] === 0x50 && bytes[1] === 0x4B && bytes[2] === 0x03 && bytes[3] === 0x04)) {
    return bytes; // pas un zip, evtc brut
  }
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  const method = dv.getUint16(8, true);
  const compSize = dv.getUint32(18, true);
  const nameLen = dv.getUint16(26, true);
  const extraLen = dv.getUint16(28, true);
  const dataStart = 30 + nameLen + extraLen;
  const compData = bytes.subarray(dataStart, dataStart + compSize);
  if (method === 0) return compData; // stocké, pas compressé
  if (method === 8) {
    const ds = new DecompressionStream('deflate-raw');
    const stream = new Blob([compData]).stream().pipeThrough(ds);
    const buf = await new Response(stream).arrayBuffer();
    return new Uint8Array(buf);
  }
  throw new Error('Méthode de compression ZIP non supportée (' + method + ')');
}

/* ===================== Lecture chaîne C (utf8, null-terminated) ===================== */
function readCString(bytes, offset, maxLen) {
  let end = offset;
  const limit = offset + maxLen;
  while (end < limit && bytes[end] !== 0) end++;
  return new TextDecoder('utf-8').decode(bytes.subarray(offset, end));
}

// Lit un bloc de taille fixe en conservant les octets nuls internes (utilisé
// pour le champ "name" des joueurs, qui empile perso\0compte\0sous-groupe\0)
function readFixedBlockParts(bytes, offset, len) {
  const raw = new TextDecoder('utf-8').decode(bytes.subarray(offset, offset + len));
  return raw.split('\0').filter((s, i, arr) => !(s === '' && i === arr.length - 1) || arr.length === 1);
}

/* ===================== Parsing principal ===================== */
async function parseEvtc(arrayBuffer, onProgress) {
  let bytes = new Uint8Array(arrayBuffer);
  bytes = await maybeUnzip(bytes);
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);

  if (!(bytes[0] === 0x45 && bytes[1] === 0x56 && bytes[2] === 0x54 && bytes[3] === 0x43)) {
    throw new Error("Ce fichier ne commence pas par la signature 'EVTC'. Ce n'est peut-être pas un vrai log ArcDPS.");
  }
  const buildVersion = readCString(bytes, 4, 8);
  const revision = bytes[12];
  const targetSpecies = dv.getUint16(13, true);

  let offset = HEADER_SIZE;
  const agentCount = dv.getUint32(offset, true); offset += 4;
  const agents = [];
  const agentByIid = new Map();
  for (let i = 0; i < agentCount; i++) {
    const base = offset + i * AGENT_SIZE;
    const iid = dv.getBigUint64(base, true);
    const prof = dv.getUint32(base + 8, true);
    const isElite = dv.getUint32(base + 12, true);
    const toughness = dv.getInt16(base + 16, true);
    const concentration = dv.getInt16(base + 18, true);
    const healing = dv.getInt16(base + 20, true);
    const hitboxWidth = dv.getUint16(base + 22, true);
    const condition = dv.getInt16(base + 24, true);
    const parts = readFixedBlockParts(bytes, base + 28, 64);

    let type = 'gadget';
    let character = parts[0] || '';
    let account = '';
    let subgroup = '';
    if (isElite !== 0xFFFFFFFF) {
      type = 'player';
      account = (parts[1] || '').replace(/^:/, '');
      subgroup = parts[2] || '';
    } else if ((prof >>> 16) !== 0xFFFF) {
      type = 'npc';
    } else {
      type = 'gadget';
    }

    const agent = {
      iid, prof, isElite, toughness, concentration, healing, hitboxWidth, condition,
      type, name: character, account, subgroup,
      profName: type === 'player' ? (PROFESSIONS[prof] || ('Prof#' + prof)) : null,
      eliteSpecName: (type === 'player' && isElite !== 0) ? (ELITE_SPECS[isElite] || null) : null,
      instanceId: 0, team: null
    };
    agents.push(agent);
    agentByIid.set(iid, agent);
  }
  offset += agentCount * AGENT_SIZE;

  const skillCount = dv.getUint32(offset, true); offset += 4;
  const skillNames = new Map();
  for (let i = 0; i < skillCount; i++) {
    const base = offset + i * SKILL_SIZE;
    const id = dv.getInt32(base, true);
    const name = readCString(bytes, base + 4, 64);
    skillNames.set(id, name);
  }
  offset += skillCount * SKILL_SIZE;

  const eventsStart = offset;
  const eventCount = Math.floor((bytes.length - eventsStart) / EVENT_SIZE);
  if (eventCount <= 0) {
    throw new Error('Aucun évènement de combat trouvé dans ce fichier.');
  }

  function readEvent(idx, o) {
    o.time = dv.getBigUint64(idx, true);
    o.srcAgent = dv.getBigUint64(idx + 8, true);
    o.dstAgent = dv.getBigUint64(idx + 16, true);
    o.value = dv.getInt32(idx + 24, true);
    o.buffDmg = dv.getInt32(idx + 28, true);
    o.overstackValue = dv.getUint32(idx + 32, true);
    o.skillId = dv.getUint32(idx + 36, true);
    o.srcInstId = dv.getUint16(idx + 40, true);
    o.dstInstId = dv.getUint16(idx + 42, true);
    o.srcMasterInstId = dv.getUint16(idx + 44, true);
    o.dstMasterInstId = dv.getUint16(idx + 46, true);
    o.iff = bytes[idx + 48];
    o.buff = bytes[idx + 49];
    o.result = bytes[idx + 50];
    o.isActivation = bytes[idx + 51];
    o.isBuffRemove = bytes[idx + 52];
    o.isNinety = bytes[idx + 53];
    o.isFifty = bytes[idx + 54];
    o.isMoving = bytes[idx + 55];
    o.isStatechange = bytes[idx + 56];
    o.isFlanking = bytes[idx + 57];
    o.isShields = bytes[idx + 58];
    o.isOffcycle = bytes[idx + 59];
  }

  /* ---- PASSE 1 : équipes (par regroupement des relations "ami") + POV + bornes temporelles ---- */
  const playerIidSet = new Set(agents.filter(a => a.type === 'player').map(a => a.iid));
  const ufParent = new Map();
  for (const iid of playerIidSet) ufParent.set(iid, iid);
  function ufFind(x) {
    while (ufParent.get(x) !== x) { ufParent.set(x, ufParent.get(ufParent.get(x))); x = ufParent.get(x); }
    return x;
  }
  function ufUnion(a, b) {
    const ra = ufFind(a), rb = ufFind(b);
    if (ra !== rb) ufParent.set(ra, rb);
  }

  let povIid = null;
  let fightStart = null, fightEnd = null;
  let combatStartTime = null, combatEndTime = null;
  for (let i = 0; i < eventCount; i++) {
    const idx = eventsStart + i * EVENT_SIZE;
    const sc = bytes[idx + 56];
    const timeMs = dv.getBigUint64(idx, true);
    if (fightStart === null) fightStart = timeMs;
    fightEnd = timeMs;
    if (sc === STATECHANGE.POINTOFVIEW) {
      povIid = dv.getBigUint64(idx + 8, true);
    } else if (sc === STATECHANGE.SQCOMBATSTART) {
      if (combatStartTime === null) combatStartTime = timeMs;
    } else if (sc === STATECHANGE.SQCOMBATEND) {
      combatEndTime = timeMs;
    } else if (sc === 0) {
      // Regroupe les agents joueurs liés par une interaction "amie" (soins,
      // boons, etc.) : bien plus fiable en McM que le champ TEAMCHANGE, qui
      // n'est pas toujours renseigné avec la couleur d'équipe attendue.
      const iff = bytes[idx + 48];
      if (iff === IFF.FRIEND) {
        const src = dv.getBigUint64(idx + 8, true);
        const dst = dv.getBigUint64(idx + 16, true);
        if (playerIidSet.has(src) && playerIidSet.has(dst)) ufUnion(src, dst);
      }
    }
    if (onProgress && i % 200000 === 0) onProgress(0.15 + 0.25 * (i / eventCount));
  }
  if (povIid === null) {
    // fallback : premier agent joueur du fichier
    const firstPlayer = agents.find(a => a.type === 'player');
    povIid = firstPlayer ? firstPlayer.iid : null;
  }

  const pov = povIid !== null ? agentByIid.get(povIid) : null;
  const povRoot = povIid !== null ? ufFind(povIid) : null;
  const povSubgroup = pov && pov.subgroup ? pov.subgroup : '';
  const allies = new Set();
  if (povIid !== null) allies.add(povIid);
  for (const iid of playerIidSet) {
    const agent = agentByIid.get(iid);
    if (povSubgroup) {
      if (agent && agent.subgroup === povSubgroup) allies.add(iid);
    } else if (povRoot !== null && ufFind(iid) === povRoot) {
      allies.add(iid);
    }
  }

  const start = combatStartTime !== null ? combatStartTime : fightStart;
  const end = combatEndTime !== null ? combatEndTime : fightEnd;
  const durationSec = Number(end - start) / 1000;

  /* ---- PASSE 2 : agrégation détaillée PAR JOUEUR (alliés + ennemis) ---- */
  const playerAgents = agents.filter(a => a.type === 'player');
  const detail = new Map(); // iid -> structure détaillée
  for (const a of playerAgents) {
    detail.set(a.iid, {
      dmgOutBySkill: new Map(),
      castsBySkill: new Map(),
      dmgInBySkill: new Map(),
      dmgInBySource: new Map(),
      downs: 0, deaths: 0, upCount: 0,
      healthTimeline: [],
      downEvents: [],
      deathEvents: [],
      recentQueue: [],
      buffIntervals: new Map(Object.keys(TRACKED_BUFFS).map(id => [Number(id), []])),
      outBuckets: new Map(),
      inBuckets: new Map()
    });
  }
  // agrégat léger pour TOUT agent (y compris PNJ/gadgets comme le siège) —
  // sert au classement des menaces qui peut inclure des sources non-joueurs
  const agg = new Map();
  function aggFor(iid) {
    let s = agg.get(iid);
    if (!s) { s = { dmgOut: 0, threatDmg: 0 }; agg.set(iid, s); }
    return s;
  }

  const RECENT_WINDOW_MS = 4000n;
  const BUCKET_MS = 5000;
  let totalAllyDmgOut = 0;
  const ev = {};

  for (let i = 0; i < eventCount; i++) {
    const idx = eventsStart + i * EVENT_SIZE;
    readEvent(idx, ev);
    const sc = ev.isStatechange;

    if (sc === STATECHANGE.COMBAT) {
      if (ev.isActivation !== 0) {
        const castDetail = detail.get(ev.srcAgent);
        if (castDetail) castDetail.castsBySkill.set(ev.skillId, (castDetail.castsBySkill.get(ev.skillId) || 0) + 1);
      }
      // On ignore les évènements d'activation de compétence (cast) et de
      // retrait de buff : "value"/"buff_dmg" n'y représentent pas des dégâts.
      if (ev.isActivation === 0 && ev.isBuffRemove === 0) {
        let dmg = 0;
        let isBuffApply = false;
        if (ev.buff === 0) {
          dmg = ev.value; // dégât direct
        } else if (ev.buffDmg !== 0) {
          dmg = ev.buffDmg; // tick de dégâts d'altération
        } else if (ev.value !== 0) {
          isBuffApply = true; // application d'un boon/altération, "value" = durée ms
        }

        if (isBuffApply) {
          const dd = detail.get(ev.dstAgent);
          if (dd && dd.buffIntervals.has(ev.skillId)) {
            const durMs = BigInt(Math.max(0, Math.min(ev.value, 3600000)));
            if (durMs > 0n) dd.buffIntervals.get(ev.skillId).push([ev.time, ev.time + durMs]);
          }
        } else if (ev.iff === IFF.FOE && dmg !== 0) {
          const srcD = detail.get(ev.srcAgent);
          if (srcD) {
            srcD.dmgOutBySkill.set(ev.skillId, (srcD.dmgOutBySkill.get(ev.skillId) || 0) + dmg);
            const b = Math.floor(Number(ev.time - start) / BUCKET_MS);
            srcD.outBuckets.set(b, (srcD.outBuckets.get(b) || 0) + dmg);
          }
          aggFor(ev.srcAgent).dmgOut += dmg;
          if (allies.has(ev.srcAgent)) totalAllyDmgOut += dmg;

          const dstD = detail.get(ev.dstAgent);
          if (dstD) {
            dstD.dmgInBySkill.set(ev.skillId, (dstD.dmgInBySkill.get(ev.skillId) || 0) + dmg);
            dstD.dmgInBySource.set(ev.srcAgent, (dstD.dmgInBySource.get(ev.srcAgent) || 0) + dmg);
            dstD.recentQueue.push({ time: ev.time, dmg, skillId: ev.skillId, src: ev.srcAgent });
            const cutoff = ev.time - RECENT_WINDOW_MS;
            while (dstD.recentQueue.length && dstD.recentQueue[0].time < cutoff) dstD.recentQueue.shift();
            const b = Math.floor(Number(ev.time - start) / BUCKET_MS);
            dstD.inBuckets.set(b, (dstD.inBuckets.get(b) || 0) + dmg);
          }
          if (allies.has(ev.dstAgent)) aggFor(ev.srcAgent).threatDmg += dmg;
        }
      }
    } else if (sc === STATECHANGE.HEALTHPCTUPDATE) {
      const dd = detail.get(ev.srcAgent);
      if (dd) dd.healthTimeline.push({ time: ev.time, pct: Number(ev.dstAgent) / 100 });
    } else if (sc === STATECHANGE.CHANGEDOWN) {
      const dd = detail.get(ev.srcAgent);
      if (dd) {
        dd.downs++;
        const lastHp = dd.healthTimeline.length ? dd.healthTimeline[dd.healthTimeline.length - 1].pct : null;
        dd.downEvents.push({ time: ev.time, hpBefore: lastHp, context: dd.recentQueue.slice().map(h => ({ ...h })) });
      }
    } else if (sc === STATECHANGE.CHANGEDEAD) {
      const dd = detail.get(ev.srcAgent);
      if (dd) {
        dd.deaths++;
        dd.deathEvents.push({ time: ev.time, context: dd.recentQueue.slice().map(h => ({ ...h })) });
      }
    } else if (sc === STATECHANGE.CHANGEUP) {
      const dd = detail.get(ev.srcAgent);
      if (dd) dd.upCount++;
    }

    if (onProgress && i % 200000 === 0) onProgress(0.4 + 0.55 * (i / eventCount));
  }

  const skillLabel = (id) => skillNames.get(id) || ('Compétence #' + id);
  const nameOf = (iid) => {
    const a = agentByIid.get(iid);
    if (!a) return 'Inconnu';
    if (a.type === 'player') return a.name + (a.account ? ' (' + a.account + ')' : '');
    return a.name || 'Agent';
  };
  const totalMs = Number(end - start) || 1;

  function finalizeBoonUptime(buffIntervals) {
    const out = [];
    for (const [buffId, meta] of Object.entries(TRACKED_BUFFS)) {
      const id = Number(buffId);
      const intervals = buffIntervals.get(id);
      if (!intervals || intervals.length === 0) continue;
      intervals.sort((a, b) => (a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0));
      let covered = 0n;
      let curStart = intervals[0][0], curEnd = intervals[0][1];
      for (let i = 1; i < intervals.length; i++) {
        const [s, e] = intervals[i];
        if (s <= curEnd) { if (e > curEnd) curEnd = e; }
        else { covered += (curEnd - curStart); curStart = s; curEnd = e; }
      }
      covered += (curEnd - curStart);
      let coveredMs = Math.min(Number(covered), totalMs * 3);
      const pct = Math.max(0, Math.min(100, (coveredMs / totalMs) * 100));
      out.push({ id, name: meta.name, cat: meta.cat, pct });
    }
    out.sort((a, b) => BOON_ORDER.indexOf(a.id) - BOON_ORDER.indexOf(b.id));
    return out;
  }

  function finalizePlayer(a) {
    const dd = detail.get(a.iid);
    const topOut = [...dd.dmgOutBySkill.entries()].map(([id, dmg]) => ({ id, name: skillLabel(id), dmg }))
      .sort((x, y) => y.dmg - x.dmg).slice(0, 8);
    const topIn = [...dd.dmgInBySkill.entries()].map(([id, dmg]) => ({ id, name: skillLabel(id), dmg }))
      .sort((x, y) => y.dmg - x.dmg).slice(0, 8);
    const casts = [...dd.castsBySkill.entries()].map(([id, count]) => ({ id, name: skillLabel(id), count }))
      .sort((x, y) => y.count - x.count || x.name.localeCompare(y.name));
    const topThreatSources = [...dd.dmgInBySource.entries()].map(([iid, dmg]) => ({ iid, name: nameOf(iid), dmg }))
      .sort((x, y) => y.dmg - x.dmg).slice(0, 8);
    const dmgOut = [...dd.dmgOutBySkill.values()].reduce((s, v) => s + v, 0);
    const dmgIn = [...dd.dmgInBySkill.values()].reduce((s, v) => s + v, 0);
    return {
      iid: a.iid.toString(),
      name: a.name, account: a.account, subgroup: a.subgroup, prof: a.profName, elite: a.eliteSpecName,
      isAlly: allies.has(a.iid), isPov: a.iid === povIid,
      downs: dd.downs, deaths: dd.deaths, upCount: dd.upCount,
      totals: { dmgOut, dmgIn },
      topOut, topIn, casts, topThreatSources,
      boonUptime: finalizeBoonUptime(dd.buffIntervals),
      healthTimeline: downsample(dd.healthTimeline, 400),
      downEvents: dd.downEvents.map(d => enrichContext(d, skillLabel, nameOf, start)),
      deathEvents: dd.deathEvents.map(d => enrichContext(d, skillLabel, nameOf, start)),
      dmgOutBuckets: [...dd.outBuckets.entries()].sort((x, y) => x[0] - y[0]),
      dmgInBuckets: [...dd.inBuckets.entries()].sort((x, y) => x[0] - y[0])
    };
  }

  const players = playerAgents
    .map(finalizePlayer)
    .sort((a, b) => (b.isAlly - a.isAlly) || (b.totals.dmgOut - a.totals.dmgOut));

  const squadLeaderboard = players
    .filter(p => p.isAlly && p.totals.dmgOut > 0)
    .map(p => ({ iid: p.iid, name: p.name, account: p.account, subgroup: p.subgroup, prof: p.prof, elite: p.elite,
      dmgOut: p.totals.dmgOut, downs: p.downs, deaths: p.deaths, isPov: p.isPov }));

  const threatLeaderboard = [...agg.entries()]
    .filter(([iid, s]) => s.threatDmg > 0)
    .sort((a, b) => b[1].threatDmg - a[1].threatDmg)
    .slice(0, 10)
    .map(([iid, s]) => {
      const a = agentByIid.get(iid);
      return {
        iid: iid.toString(),
        name: a ? (a.type === 'player' ? a.name + (a.account ? ' (' + a.account + ')' : '') : a.name) : ('Agent'),
        prof: a && a.type === 'player' ? a.profName : (a ? 'PNJ/Gadget' : '?'),
        elite: a && a.type === 'player' ? a.eliteSpecName : null,
        dmg: s.threatDmg
      };
    });

  const isWvW = targetSpecies === 1;

  return {
    meta: { buildVersion, revision, targetSpecies, isWvW, agentCount, skillCount, eventCount },
    fight: { start, end, durationSec },
    povIid: povIid !== null ? povIid.toString() : null,
    players,
    squadLeaderboard,
    threatLeaderboard,
    skillIds: [...new Set(players.flatMap(p => [...p.casts, ...p.topOut, ...p.topIn].map(s => s.id)))],
    groupMode: povSubgroup ? 'subgroup' : 'interactions',
    allyCount: allies.size,
    enemyPlayerCount: players.filter(p => !p.isAlly).length
  };
}

function enrichContext(d, skillLabel, nameOf, start) {
  const top = [...d.context].sort((a, b) => b.dmg - a.dmg).slice(0, 3)
    .map(h => ({ name: skillLabel(h.skillId), src: nameOf(h.src), dmg: h.dmg }));
  const totalContextDmg = d.context.reduce((a, h) => a + h.dmg, 0);
  return {
    tSec: Number(d.time - start) / 1000,
    hpBefore: d.hpBefore,
    topSources: top,
    burstDmg4s: totalContextDmg
  };
}

function downsample(points, maxPoints) {
  if (points.length <= maxPoints) return points.map(p => ({ t: Number(p.time), pct: p.pct }));
  const step = Math.ceil(points.length / maxPoints);
  const out = [];
  for (let i = 0; i < points.length; i += step) out.push({ t: Number(points[i].time), pct: points[i].pct });
  return out;
}

</script>
<script>
/* ======================================================================
   INTERFACE
   ====================================================================== */
const app = document.getElementById('app');
let CURRENT_DATA = null;
let CURRENT_FILE = '';

function fmt(n){
  if (n === null || n === undefined || isNaN(n)) return '—';
  return Math.round(n).toLocaleString('fr-FR');
}
function fmt1(n){
  if (n === null || n === undefined || isNaN(n)) return '—';
  return n.toLocaleString('fr-FR', {maximumFractionDigits:1, minimumFractionDigits:1});
}
function fmtTime(sec){
  if (sec === null || sec === undefined || isNaN(sec)) return '—';
  const m = Math.floor(sec/60), s = Math.floor(sec%60);
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function initials(name){
  return (name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
}

/* ---------------- état / drop zone ---------------- */
function renderDropzone(){
  CURRENT_DATA = null;
  app.innerHTML = `
    <div class="dz" id="dz">
      <div class="icon">⚔️</div>
      <h2>Déposez votre log de combat ici</h2>
      <p>ou cliquez pour parcourir vos fichiers</p>
      <div class="fmt"><span>.evtc</span><span>.zevtc</span><span>.evtc.zip</span></div>
      <input type="file" id="fileInput" accept=".evtc,.zevtc,.zip">
    </div>
  `;
  const dz = document.getElementById('dz');
  const input = document.getElementById('fileInput');
  dz.addEventListener('click', () => input.click());
  input.addEventListener('change', e => { if (e.target.files[0]) handleFile(e.target.files[0]); });
  ['dragenter','dragover'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add('drag'); }));
  ['dragleave','drop'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove('drag'); }));
  dz.addEventListener('drop', e => {
    const f = e.dataTransfer.files[0];
    if (f) handleFile(f);
  });
}

function renderLoading(fileName){
  app.innerHTML = `
    <div class="mini-bar"><span class="fname">${esc(fileName)}</span><span></span></div>
    <div class="loading">
      <div>Lecture et analyse du log en cours…</div>
      <div class="progress"><div id="prog"></div></div>
    </div>
  `;
}
function setProgress(p){
  const el = document.getElementById('prog');
  if (el) el.style.width = Math.round(Math.min(1,p)*100) + '%';
}

function renderError(fileName, message){
  app.innerHTML = `
    <div class="mini-bar"><span class="fname">${esc(fileName)}</span>
      <button onclick="renderDropzone()">Changer de fichier</button></div>
    <div class="err"><b>Impossible d'analyser ce fichier.</b><br>${esc(message)}</div>
  `;
}

async function loadSkillIcons(data){
  data.skillIcons = {};
  const ids = data.skillIds || [];
  for (let i = 0; i < ids.length; i += 100){
    const chunk = ids.slice(i, i + 100);
    try{
      const response = await fetch('https://api.guildwars2.com/v2/skills?ids=' + chunk.join(',') + '&lang=fr');
      if (!response.ok) continue;
      const skills = await response.json();
      skills.forEach(skill => { if (skill.icon) data.skillIcons[skill.id] = skill.icon; });
    }catch(err){
      console.warn('Icônes de compétences indisponibles', err);
      return;
    }
  }
}

async function handleFile(file){
  renderLoading(file.name);
  try{
    const buf = await file.arrayBuffer();
    await new Promise(r => setTimeout(r, 30));
    const data = await parseEvtc(buf, setProgress);
    await loadSkillIcons(data);
    renderResults(file.name, data);
  }catch(err){
    console.error(err);
    renderError(file.name, err.message || String(err));
  }
}

/* ---------------- diagnostics automatiques (par personnage) ---------------- */
function buildDiagnostics(data, p){
  const out = [];
  const isSelf = p.isPov;
  const subj = isSelf ? 'vous' : esc(p.name);
  const Subj = isSelf ? 'Vous' : esc(p.name);
  const verbAvoir = isSelf ? 'avez' : 'a';
  const faveur = isSelf ? 'en votre faveur' : 'en sa faveur';

  if (p.downs === 0 && p.deaths === 0){
    out.push({lvl:'good', html:`${Subj} n'${isSelf?'avez':'a'} été ni mis à terre ni tué${isSelf?'(e)':''} pendant ce combat.`});
  } else {
    out.push({lvl: (isSelf || p.isAlly) ? 'warn' : 'info',
      html:`${Subj} ${verbAvoir} été <b>mis à terre ${p.downs} fois</b> et <b>tué ${p.deaths} fois</b> pendant ce combat.`});
  }

  const allEvents = [...p.downEvents.map(e=>({...e,kindPhrase:'une mise à terre'})), ...p.deathEvents.map(e=>({...e,kindPhrase:'sa mort'}))]
    .sort((a,b)=>a.tSec-b.tSec).slice(0,3);
  for (const e of allEvents){
    if (e.topSources.length){
      const top = e.topSources[0];
      out.push({lvl:'warn', html:`À <b>${fmtTime(e.tSec)}</b>, ${subj} ${verbAvoir} subi <b>${fmt(e.burstDmg4s)}</b> dégâts en ~4s avant ${e.kindPhrase} — surtout <b>${esc(top.name)}</b> par <b>${esc(top.src)}</b>.`});
    }
  }

  const boon = id => p.boonUptime.find(b=>b.id===id);
  const stab = boon(1122);
  if ((p.downs>0 || p.deaths>0) && (!stab || stab.pct < 20)){
    out.push({lvl:'warn', html:`Uptime de <b>Stabilité</b> très faible (${stab?fmt1(stab.pct):'0,0'} %) : les enchaînements de contrôle (stun / knockback / pull) passent probablement plus facilement sur ${subj}, ce qui peut mener à des mises à terre en combat de groupe.`});
  }
  const prot = boon(717);
  if (!prot || prot.pct < 15){
    out.push({lvl:'info', html:`Peu ou pas de <b>Protection</b> reçue (${prot?fmt1(prot.pct):'0,0'} %) : la réduction de dégâts entrants (-33 %) est quasi nulle pour ${subj}.`});
  }
  const quick = boon(1187);
  if (quick && quick.pct < 30) out.push({lvl:'info', html:`Uptime de <b>Célérité</b> limité (${fmt1(quick.pct)} %) sur ${subj} : la cadence d'actions/soins en est réduite une bonne partie du combat.`});

  if (p.totals.dmgIn > 0 && p.totals.dmgOut > 0){
    const ratio = p.totals.dmgIn / p.totals.dmgOut;
    if (ratio > 2.5){
      out.push({lvl:'warn', html:`Le ratio dégâts subis / infligés est déséquilibré pour ${subj} (×${fmt1(ratio)} en défaveur) : vérifiez le positionnement (trop exposé en 1ʳᵉ ligne ?) ou l'équilibre offense/défense du build.`});
    } else if (ratio < 0.6){
      out.push({lvl:'good', html:`Bon ratio dégâts infligés / subis pour ${subj} (×${fmt1(1/ratio)} ${faveur}).`});
    }
  }

  if (p.isAlly && data.squadLeaderboard.length >= 3){
    const sorted = [...data.squadLeaderboard].sort((a,b)=>b.dmgOut-a.dmgOut);
    const rank = sorted.findIndex(s=>s.iid===p.iid)+1;
    if (rank > 0 && rank > Math.ceil(sorted.length*0.6)){
      out.push({lvl:'info', html:`Les dégâts infligés placent ${subj} <b>${rank}ᵉ sur ${sorted.length}</b> parmi les alliés détectés dans ce log — comparez avec la rotation des mieux classés.`});
    }
  } else if (data.allyCount <= 2){
    out.push({lvl:'info', html:`Peu d'alliés détectés dans ce log (${data.allyCount}) : l'analyse d'escouade sera limitée à ce que le client d'enregistrement a pu observer.`});
  }

  if (p.isAlly && data.threatLeaderboard.length){
    const top = data.threatLeaderboard[0];
    const totalThreat = data.threatLeaderboard.reduce((a,t)=>a+t.dmg,0);
    const share = totalThreat ? (top.dmg/totalThreat*100) : 0;
    if (share > 25){
      out.push({lvl:'warn', html:`<b>${esc(top.name)}</b>${top.prof?` (${esc(top.prof)}${top.elite?' '+esc(top.elite):''})`:''} concentre à lui/elle seul(e) <b>${fmt1(share)} %</b> des dégâts subis par le groupe détecté — une cible à surveiller ou prioriser au prochain affrontement.`});
    }
  }

  if (!data.meta.isWvW){
    out.push({lvl:'info', html:`L'identifiant de carte cible de ce log (${data.meta.targetSpecies}) ne correspond pas au marqueur habituel du McM — vérifiez qu'il s'agit bien du bon fichier.`});
  }

  return out;
}

/* ---------------- graphique santé (SVG) ---------------- */
function healthChart(data, p){
  const W = 900, H = 200, PAD_L = 34, PAD_B = 22, PAD_T = 10;
  const start = Number(data.fight.start);
  const durMs = Number(data.fight.end) - start || 1;
  const x = t => PAD_L + ((t-start)/durMs) * (W-PAD_L-8);
  const y = pct => PAD_T + (1 - Math.max(0,Math.min(100,pct))/100) * (H-PAD_T-PAD_B);

  const pts = p.healthTimeline;
  if (!pts.length) return '<p class="note">Pas de données de santé pour ce personnage (hors de portée d\'observation la plupart du temps).</p>';
  let path = '';
  pts.forEach((pt,i)=>{ path += (i===0?'M':'L') + x(pt.t).toFixed(1) + ',' + y(pt.pct).toFixed(1) + ' '; });

  const grid = [0,25,50,75,100].map(v => `
    <line x1="${PAD_L}" x2="${W-8}" y1="${y(v)}" y2="${y(v)}" stroke="#252b36" stroke-width="1"/>
    <text x="4" y="${y(v)+3}" font-size="9" fill="#7d8494" font-family="JetBrains Mono, monospace">${v}%</text>
  `).join('');

  const markers = [
    ...p.downEvents.map(e=>({t:start+e.tSec*1000, color:'#d8952f'})),
    ...p.deathEvents.map(e=>({t:start+e.tSec*1000, color:'#ef6a62'}))
  ].map(m => `
    <line x1="${x(m.t).toFixed(1)}" x2="${x(m.t).toFixed(1)}" y1="${PAD_T}" y2="${H-PAD_B}" stroke="${m.color}" stroke-width="1" stroke-dasharray="3,3" opacity=".55"/>
    <circle cx="${x(m.t).toFixed(1)}" cy="${PAD_T+2}" r="3.5" fill="${m.color}"/>
  `).join('');

  const xTicks = [];
  const nTicks = 6;
  for (let i=0;i<=nTicks;i++){
    const t = start + (durMs*i/nTicks);
    xTicks.push(`<text x="${x(t).toFixed(1)}" y="${H-4}" font-size="9" fill="#7d8494" font-family="JetBrains Mono, monospace" text-anchor="middle">${fmtTime((t-start)/1000)}</text>`);
  }

  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:600px">
    ${grid}
    <path d="${path}" fill="none" stroke="#5fae7d" stroke-width="1.6"/>
    ${markers}
    ${xTicks.join('')}
  </svg></div>
  <div class="legend">
    <span><span class="sw" style="background:#5fae7d"></span>Santé (%)</span>
    <span><span class="sw" style="background:#d8952f"></span>Mis à terre</span>
    <span><span class="sw" style="background:#ef6a62"></span>Mort</span>
  </div>`;
}

/* ---------------- graphique dégâts dans le temps (barres miroir) ---------------- */
function dmgOverTimeChart(data, p){
  const outMap = new Map(p.dmgOutBuckets.map(([k,v])=>[Number(k),v]));
  const inMap = new Map(p.dmgInBuckets.map(([k,v])=>[Number(k),v]));
  const maxB = Math.max(0, ...outMap.keys(), ...inMap.keys());
  if (outMap.size===0 && inMap.size===0) return '<p class="note">Pas assez de données pour ce graphique.</p>';
  const maxVal = Math.max(1, ...outMap.values(), ...inMap.values());

  const W = 900, H = 180, MID = 90, PAD_L=34;
  const barW = Math.max(1, (W-PAD_L-8) / (maxB+1) - 2);
  let bars = '';
  for (let i=0;i<=maxB;i++){
    const xo = PAD_L + i*((W-PAD_L-8)/(maxB+1));
    const o = outMap.get(i)||0, inn = inMap.get(i)||0;
    const hOut = (o/maxVal) * (MID-8);
    const hIn = (inn/maxVal) * (MID-8);
    bars += `<rect x="${xo.toFixed(1)}" y="${(MID-hOut).toFixed(1)}" width="${barW.toFixed(1)}" height="${hOut.toFixed(1)}" fill="#5fae7d"/>`;
    bars += `<rect x="${xo.toFixed(1)}" y="${MID}" width="${barW.toFixed(1)}" height="${hIn.toFixed(1)}" fill="#c1443c"/>`;
  }
  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:600px">
    <line x1="${PAD_L}" x2="${W-8}" y1="${MID}" y2="${MID}" stroke="#3a4150" stroke-width="1"/>
    ${bars}
    <text x="4" y="${MID-70}" font-size="9" fill="#7d8494">infligés</text>
    <text x="4" y="${MID+80}" font-size="9" fill="#7d8494">subis</text>
  </svg></div>
  <div class="legend">
    <span><span class="sw" style="background:#5fae7d"></span>Dégâts infligés / 5s</span>
    <span><span class="sw" style="background:#c1443c"></span>Dégâts subis / 5s</span>
  </div>`;
}

/* ---------------- sélecteur de personnage ---------------- */
function charRow(p){
  const you = p.isPov ? ' <span class="you">(vous)</span>' : '';
  return `<div class="char-row" data-iid="${esc(p.iid)}" data-search="${esc((p.name+' '+(p.account||'')).toLowerCase())}" onclick="selectPlayer('${p.iid}')">
    <span class="side ${p.isAlly?'ally':'enemy'}">${p.isAlly?'Allié':'Ennemi'}</span>
    <span class="cinfo">
      <span class="cname">${esc(p.name)}${you}</span><br>
      <span class="csub">${esc(p.prof||'')}${p.elite?' · '+esc(p.elite):''}${p.account?' · '+esc(p.account):''}</span>
    </span>
    <span class="cdmg">${fmt(p.totals.dmgOut)}</span>
  </div>`;
}

function filterChars(value){
  const v = value.trim().toLowerCase();
  document.querySelectorAll('.char-row').forEach(el => {
    el.style.display = (!v || el.dataset.search.includes(v)) ? '' : 'none';
  });
}

function selectPlayer(iid){
  if (!CURRENT_DATA) return;
  const p = CURRENT_DATA.players.find(x => x.iid === iid);
  if (!p) return;
  const el = document.getElementById('playerDetail');
  if (el) el.innerHTML = renderPlayerDetail(CURRENT_DATA, p);
  document.querySelectorAll('.char-row').forEach(row => {
    row.classList.toggle('active', row.dataset.iid === iid);
  });
  const el2 = document.getElementById('playerDetail');
  if (el2) el2.scrollIntoView({ behavior:'smooth', block:'nearest' });
}

/* ---------------- détail d'un personnage (rejoué à chaque sélection) ---------------- */
function renderPlayerDetail(data, p){
  const diagnostics = buildDiagnostics(data, p);
  const dps = data.fight.durationSec>0 ? p.totals.dmgOut/data.fight.durationSec : 0;
  const dpsIn = data.fight.durationSec>0 ? p.totals.dmgIn/data.fight.durationSec : 0;

  const boonRows = p.boonUptime.length ? p.boonUptime.map(b => `
    <div class="boon-row">
      <div class="name">${esc(b.name)}</div>
      <div class="boon-track"><div style="width:${b.pct.toFixed(1)}%;background:${b.cat==='boon'?'#5a9bc9':'#9d7bc9'}"></div></div>
      <div class="pct">${fmt1(b.pct)} %</div>
    </div>`).join('') : '<p class="note">Aucun boon/altération suivi détecté sur ce personnage dans ce log.</p>';

  const topOutRows = p.topOut.map(s => `<tr><td>${esc(s.name)}</td><td class="num">${fmt(s.dmg)}</td></tr>`).join('')
    || '<tr><td colspan="2" class="note">Aucune donnée</td></tr>';
  const topInRows = p.topIn.map(s => `<tr><td>${esc(s.name)}</td><td class="num">${fmt(s.dmg)}</td></tr>`).join('')
    || '<tr><td colspan="2" class="note">Aucune donnée</td></tr>';
  const castRows = p.casts.map(s => `
    <div class="skill-row">
      ${data.skillIcons && data.skillIcons[s.id]
        ? `<img class="skill-icon" src="${esc(data.skillIcons[s.id])}" alt="">`
        : '<span class="skill-icon" aria-hidden="true">✦</span>'}
      <span class="skill-name">${esc(s.name)}</span>
      <span class="skill-count">×${s.count}</span>
    </div>`).join('')
    || '<p class="note">Aucune activation de compétence détectée pour ce personnage.</p>';

  function eventBlock(e, kind){
    const badge = kind==='down' ? 'Mis à terre' : 'Mort';
    const srcs = e.topSources.map(s => `<div><b>${esc(s.name)}</b> par ${esc(s.src)} — ${fmt(s.dmg)} dégâts</div>`).join('')
      || '<div>Aucune source dominante identifiée dans les 4s précédentes.</div>';
    return `<div class="event-item ${kind}">
      <div class="evhead"><span class="t">${fmtTime(e.tSec)}</span><span class="badge">${badge}</span></div>
      <div class="note" style="margin:0 0 8px">Santé juste avant : ${e.hpBefore!==null?fmt1(e.hpBefore)+' %':'inconnue'} · Dégâts encaissés sur les 4s précédentes : <b style="color:var(--text)">${fmt(e.burstDmg4s)}</b></div>
      <div class="srcs">${srcs}</div>
    </div>`;
  }
  const eventsHtml = [
    ...p.downEvents.map(e=>({e,kind:'down',t:e.tSec})),
    ...p.deathEvents.map(e=>({e,kind:'death',t:e.tSec}))
  ].sort((a,b)=>a.t-b.t).map(x=>eventBlock(x.e,x.kind)).join('')
   || `<p class="note">Aucune mise à terre ni mort enregistrée pour ce personnage durant ce combat.</p>`;

  return `
    <section style="margin-top:0">
      <div class="card pov-card">
        <div class="pov-avatar">${esc(initials(p.name))}</div>
        <div style="flex:1;min-width:180px">
          <div class="pov-name">${esc(p.name)} ${p.account?`<span class="note" style="display:inline">(${esc(p.account)})</span>`:''} ${p.isPov?'<span class="tag">vous</span>':(p.isAlly?'<span class="tag">allié</span>':'<span class="tag">ennemi</span>')}</div>
          <div class="pov-sub">${esc(p.prof||'')}${p.elite?' — '+esc(p.elite):''}${p.subgroup?' · Sous-groupe '+esc(p.subgroup):''} · ${data.meta.isWvW?'McM (WvW)':'Carte non-McM'} · build ArcDPS ${esc(data.meta.buildVersion)}</div>
        </div>
        <div style="display:flex;gap:22px;flex-wrap:wrap">
          <div><div class="note" style="margin:0">Durée</div><div style="font-family:'JetBrains Mono';font-weight:600">${fmtTime(data.fight.durationSec)}</div></div>
          <div><div class="note" style="margin:0">Alliés vus</div><div style="font-family:'JetBrains Mono';font-weight:600">${data.allyCount}</div></div>
          <div><div class="note" style="margin:0">Ennemis vus</div><div style="font-family:'JetBrains Mono';font-weight:600">${data.enemyPlayerCount}</div></div>
        </div>
      </div>
    </section>

    <section>
      <div class="grid cols-4">
        <div class="stat"><div class="label">Dégâts infligés</div><div class="value green">${fmt(p.totals.dmgOut)}</div><div class="sub">${fmt(dps)} / s en moyenne</div></div>
        <div class="stat"><div class="label">Dégâts subis</div><div class="value red">${fmt(p.totals.dmgIn)}</div><div class="sub">${fmt(dpsIn)} / s en moyenne</div></div>
        <div class="stat"><div class="label">Mises à terre</div><div class="value gold">${p.downs}</div><div class="sub">${p.upCount} relevé(s)</div></div>
        <div class="stat"><div class="label">Morts</div><div class="value ${p.deaths?'red':''}">${p.deaths}</div><div class="sub">sur ${fmtTime(data.fight.durationSec)} de combat</div></div>
      </div>
    </section>

    <section>
      <div class="section-title">Points à surveiller</div>
      <div class="diag">
        ${diagnostics.map(x=>`<div class="diag-item ${x.lvl}"><div class="dot"></div><p>${x.html}</p></div>`).join('') || '<p class="note">Pas assez de données pour établir un diagnostic.</p>'}
      </div>
    </section>

    <section>
      <div class="section-title">Santé au fil du combat</div>
      <div class="card">${healthChart(data, p)}</div>
    </section>

    <section>
      <div class="section-title">Dégâts infligés / subis dans le temps</div>
      <div class="card">${dmgOverTimeChart(data, p)}</div>
    </section>

    <section>
      <div class="section-title">Mises à terre et morts — contexte</div>
      ${eventsHtml}
    </section>

    <section>
      <div class="grid cols-2">
        <div class="card">
          <div class="section-title" style="margin-bottom:10px">Compétences lancées</div>
          <div class="skill-list">${castRows}</div>
          <p class="note">Nombre d’activations observées dans le log. Les icônes viennent de l’API officielle GW2 quand elle est accessible.</p>
        </div>
        <div class="card">
          <div class="section-title" style="margin-bottom:10px">Boons & altérations sur ce personnage</div>
          <div class="boonlist">${boonRows}</div>
          <p class="note"><span class="sw" style="background:#5a9bc9;display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px"></span>boon reçu
            &nbsp;&nbsp;<span class="sw" style="background:#9d7bc9;display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px"></span>altération subie<br>
            Approximation par fusion des fenêtres d'application — proche mais pas identique à un rapport Elite Insights.</p>
        </div>
        <div class="card">
          <div class="section-title" style="margin-bottom:10px">Meilleures sources de dégâts infligés</div>
          <table><thead><tr><th>Compétence</th><th class="num">Dégâts</th></tr></thead><tbody>${topOutRows}</tbody></table>
        </div>
      </div>
    </section>

    <section>
      <div class="grid cols-2">
        <div class="card">
          <div class="section-title" style="margin-bottom:10px">Ce qui a fait le plus mal</div>
          <table><thead><tr><th>Compétence</th><th class="num">Dégâts</th></tr></thead><tbody>${topInRows}</tbody></table>
        </div>
        <div class="card">
          <div class="section-title" style="margin-bottom:10px">D'où venaient les dégâts subis</div>
          <table><thead><tr><th>Source</th><th class="num">Dégâts</th></tr></thead><tbody>
            ${p.topThreatSources.map(t=>`<tr><td>${esc(t.name)}</td><td class="num">${fmt(t.dmg)}</td></tr>`).join('') || '<tr><td colspan="2" class="note">Aucune donnée</td></tr>'}
          </tbody></table>
        </div>
      </div>
    </section>
  `;
}

/* ---------------- rendu principal (structure globale + sélecteur) ---------------- */
function renderResults(fileName, data){
  CURRENT_DATA = data;
  CURRENT_FILE = fileName;

  const squadRows = data.squadLeaderboard.map(s => `
    <tr class="${s.isPov?'pov-row':''}" style="cursor:pointer" onclick="selectPlayer('${s.iid}')">
      <td>${esc(s.name)}${s.isPov?' <span class="tag">vous</span>':''}<br><span class="note" style="margin:0">${esc(s.prof||'')}${s.elite?' · '+esc(s.elite):''}${s.subgroup?' · groupe '+esc(s.subgroup):''}</span></td>
      <td class="num">${fmt(s.dmgOut)}</td>
      <td class="num">${s.downs}</td>
      <td class="num">${s.deaths}</td>
    </tr>`).join('') || '<tr><td colspan="4" class="note">Aucun allié détecté</td></tr>';

  const playerIids = new Set(data.players.map(p=>p.iid));
  const threatRows = data.threatLeaderboard.map(t => `
    <tr${playerIids.has(t.iid)?` style="cursor:pointer" onclick="selectPlayer('${t.iid}')"`:''}>
      <td>${esc(t.name)}<br><span class="note" style="margin:0">${esc(t.prof||'')}${t.elite?' · '+esc(t.elite):''}</span></td>
      <td class="num">${fmt(t.dmg)}</td>
    </tr>`).join('') || '<tr><td colspan="2" class="note">Aucune menace identifiée</td></tr>';

  app.innerHTML = `
    <div class="mini-bar">
      <span class="fname">${esc(fileName)}</span>
      <button onclick="renderDropzone()">Changer de fichier</button>
    </div>

    <section style="margin-top:22px">
      <div class="card">
        <div class="section-title" style="margin-bottom:10px">Personnages détectés (${data.players.length})</div>
        <input type="text" class="filter-input" placeholder="Filtrer par nom ou compte…" oninput="filterChars(this.value)">
        <div class="char-list" id="charList">
          ${data.players.length ? data.players.map(charRow).join('') : '<div class="char-empty">Aucun joueur détecté dans ce log.</div>'}
        </div>
      </div>
    </section>

    <div id="playerDetail"></div>

    <section>
      <div class="section-title">Classement de l'escouade (alliés détectés)</div>
      <div class="card">
        <table>
          <thead><tr><th>Joueur / groupe</th><th class="num">Dégâts infligés</th><th class="num">Downs</th><th class="num">Morts</th></tr></thead>
          <tbody>${squadRows}</tbody>
        </table>
        <p class="note">${data.groupMode === 'subgroup'
          ? 'Alliés regroupés par le sous-groupe ArcDPS du personnage observé. Les autres sous-groupes de la même escouade ne sont pas inclus dans ce classement.'
          : 'Alliés regroupés par les interactions "amies" observées (soins, boons…).'} Cliquez un nom pour voir son détail.</p>
      </div>
    </section>

    <section>
      <div class="section-title">Menaces ennemies (dégâts infligés à votre groupe)</div>
      <div class="card">
        <table>
          <thead><tr><th>Joueur / source ennemie</th><th class="num">Dégâts infligés au groupe</th></tr></thead>
          <tbody>${threatRows}</tbody>
        </table>
      </div>
    </section>

    <section>
      <div class="card">
        <div class="section-title" style="margin-bottom:10px">Détails techniques du fichier</div>
        <p class="note">
          Version ArcDPS : <b style="color:var(--text)">${esc(data.meta.buildVersion)}</b> (révision ${data.meta.revision}) ·
          Agents : ${data.meta.agentCount} · Compétences répertoriées : ${data.meta.skillCount} ·
          Évènements de combat : ${fmt(data.meta.eventCount)} · Espèce cible : ${data.meta.targetSpecies}
        </p>
      </div>
    </section>
  `;

  selectPlayer(data.povIid);
}

renderDropzone();
</script>
</body>
</html>
